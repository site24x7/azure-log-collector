name: Validate Function App

on:
  pull_request:
    paths:
      - 'function-app/**'
      - 'setup/**'
      - '.github/workflows/**'
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            function-app/requirements.txt
            function-app/requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r function-app/requirements.txt -r function-app/requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest function-app/tests -q
      - name: Validate setup scripts and deployment template
        run: |
          bash -n setup/setup.sh setup/teardown.sh
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path('function-app/VERSION').read_text().strip()
          template = json.loads(Path('setup/azuredeploy.json').read_text())
          expected = f'https://github.com/${{ github.repository }}/releases/download/v{version}/s247-function-app.zip'
          assert template['variables']['functionZipUrl'] == expected, 'ARM package URL must match VERSION'
          for path in Path('function-app').rglob('function.json'):
              json.loads(path.read_text())
          json.loads(Path('function-app/host.json').read_text())
          PY
