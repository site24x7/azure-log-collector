name: Release Function App

on:
  push:
    paths:
      - 'function-app/VERSION'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if VERSION unchanged'
        type: boolean
        required: false
        default: false
      stable_validation_confirmed:
        description: 'Confirm matching candidate passed fresh install, repeat deploy, upgrade, rollback and real ingestion'
        type: boolean
        required: false
        default: false
      validation_report_url:
        description: 'HTTPS evidence report URL for stable release validation'
        type: string
        required: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-function-app.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Read version
        id: version
        run: |
          VERSION=$(cat function-app/VERSION | tr -d '[:space:]')
          # Checked before any step uses it: later steps put it in shell commands.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+[0-9]*)?$ ]]; then
            echo "::error::function-app/VERSION is not a version (x.y.z or x.y.z-betaN)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require production validation approval for stable releases
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          STABLE_VALIDATION_CONFIRMED: ${{ inputs.stable_validation_confirmed }}
          VALIDATION_REPORT_URL: ${{ inputs.validation_report_url }}
        run: python3 setup/check-release-approval.py

      - name: Verify ARM template pins to this tag
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          EXPECTED="https://raw.githubusercontent.com/${{ github.repository }}/packages/${TAG}/s247-function-app.zip"
          if ! grep -q "$EXPECTED" setup/azuredeploy.json; then
            echo "::error::setup/azuredeploy.json functionZipUrl must be pinned to ${EXPECTED}"
            grep functionZipUrl setup/azuredeploy.json
            exit 1
          fi
          echo "functionZipUrl OK: pinned to ${TAG}"

      - name: Build function app zip
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        run: |
          cd function-app
          # Pre-install pip dependencies into .python_packages so that the zip is
          # self-contained and can be deployed via WEBSITE_RUN_FROM_PACKAGE.
          # Force manylinux2014 (glibc 2.17) wheels so binaries run on the Azure
          # Functions Linux Consumption worker (Debian 11 / glibc 2.31), not on
          # the GH runner's glibc. Without --platform we get manylinux_2_34
          # wheels that fail with "GLIBC_2.33 not found".
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --only-binary=:all: \
            --target=".python_packages/lib/site-packages" \
            --no-compile \
            --upgrade \
            -r requirements.txt
          zip -r ../s247-function-app.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".venv/*" \
            -x ".pytest_cache/*" \
            -x "tests/*" \
            -x "local.settings.json" \
            -x "requirements-dev.txt"
          cd ..
          echo "Zip size: $(du -h s247-function-app.zip | cut -f1)"
          echo "Contents:"
          unzip -l s247-function-app.zip | tail -5

      - name: Generate version.json
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Digest the exact zip we are about to publish so the AutoUpdater can
          # verify package integrity before deploying it (anti-tamper).
          SHA256="$(sha256sum s247-function-app.zip | cut -d' ' -f1)"
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "package_url": "https://github.com/${REPO}/releases/download/${TAG}/s247-function-app.zip",
            "sha256": "${SHA256}",
            "release_notes": "Auto-release of function app version ${VERSION}"
          }
          EOF
          cat version.json

      # Azure refuses to create a Linux Consumption app whose WEBSITE_RUN_FROM_PACKAGE
      # URL redirects, and release asset URLs always 302. The template therefore
      # points at this byte-identical copy on the packages branch, which
      # raw.githubusercontent.com serves directly. Published before the release so
      # a released template never points at a missing package.
      - name: Publish direct-download package copy
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          PKG_DIR="$RUNNER_TEMP/packages"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" packages >/dev/null; then
            git clone --depth 1 --branch packages "$REMOTE" "$PKG_DIR"
          else
            git init -b packages "$PKG_DIR"
            git -C "$PKG_DIR" remote add origin "$REMOTE"
          fi
          # A released version's package is never replaced: the template of that
          # release installs from this path. Only a run that failed before
          # creating the release may publish it again.
          if [ -f "$PKG_DIR/$TAG/s247-function-app.zip" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "::error::$TAG is already released; bump function-app/VERSION instead of replacing its package"
            exit 1
          fi
          mkdir -p "$PKG_DIR/$TAG"
          cp s247-function-app.zip "$PKG_DIR/$TAG/s247-function-app.zip"
          cd "$PKG_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$TAG/s247-function-app.zip"
          git diff --cached --quiet || git commit -m "Package for $TAG"
          git push origin packages

          # Prove the URL the template uses answers 200 directly (no redirect)
          # and serves the exact zip. raw.githubusercontent can lag a push briefly.
          URL="https://raw.githubusercontent.com/${REPO}/packages/${TAG}/s247-function-app.zip"
          WANT="$(sha256sum "$GITHUB_WORKSPACE/s247-function-app.zip" | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            CODE="$(curl -s -o "$RUNNER_TEMP/raw.zip" -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "200" ] && [ "$(sha256sum "$RUNNER_TEMP/raw.zip" | cut -d' ' -f1)" = "$WANT" ]; then
              echo "Direct package URL OK: $URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE or digest mismatch; retrying"
            sleep 15
          done
          echo "::error::$URL did not serve the release zip directly"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EXISTS: ${{ steps.check_release.outputs.exists }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' || inputs.force_release == true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          NOTES="Auto-release of Site24x7 Diagnostic Logs Function App version $VERSION"
          if [[ "$VERSION" != *-* ]]; then
            NOTES="$NOTES. Production validation evidence: $VALIDATION_REPORT_URL"
          fi

          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          # Delete existing release if force
          if [ "$FORCE_RELEASE" = "true" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push --delete origin "$TAG" 2>/dev/null || true
          fi

          gh release create "$TAG" \
            --title "Function App $VERSION" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            "${RELEASE_FLAGS[@]}" \
            s247-function-app.zip \
            version.json \
            setup/azuredeploy.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_REPORT_URL: ${{ inputs.validation_report_url }}
          FORCE_RELEASE: ${{ inputs.force_release }}

      - name: Summary
        run: |
          echo "### Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Zip:** s247-function-app.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- **version.json URL:** https://github.com/${{ github.repository }}/releases/latest/download/version.json" >> "$GITHUB_STEP_SUMMARY"
