name: Release Function App

on:
  push:
    paths:
      - 'function-app/VERSION'
    branches:
      - main
  workflow_dispatch:
    inputs:
      stable_validation_confirmed:
        description: 'Confirm matching candidate passed fresh install, repeat deploy, upgrade, rollback and real ingestion'
        type: boolean
        required: false
        default: false
      validation_report_url:
        description: 'HTTPS evidence report URL for stable release validation'
        type: string
        required: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-function-app.yml

  release:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Read version
        id: version
        run: |
          VERSION=$(cat function-app/VERSION | tr -d '[:space:]')
          # Checked before any step uses it: later steps put it in shell commands.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+[0-9]*)?$ ]]; then
            echo "::error::function-app/VERSION is not a version (x.y.z or x.y.z-betaN)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # A published version is never replaced: customers may have installed it and the
      # updater trusts its digest. Only a draft left by a failed run is rebuilt (a draft
      # is never served and has no tag yet); anything else needs a new VERSION.
      - name: Check the release state
        id: check_release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" = "true" ]; then
              echo "state=draft" >> "$GITHUB_OUTPUT"
              echo "A draft of $TAG from a failed run exists; it is rebuilt."
            else
              echo "state=published" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published and is never replaced. Bump function-app/VERSION for a new release."
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists without a release. Bump function-app/VERSION; existing tags are not reused."
            exit 1
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require production validation approval for stable releases
        if: steps.check_release.outputs.state != 'published'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_EVENT: ${{ github.event_name }}
          STABLE_VALIDATION_CONFIRMED: ${{ inputs.stable_validation_confirmed }}
          VALIDATION_REPORT_URL: ${{ inputs.validation_report_url }}
        run: python3 setup/check-release-approval.py

      - name: Verify ARM template pins to this tag
        if: steps.check_release.outputs.state != 'published'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          EXPECTED="https://github.com/${{ github.repository }}/releases/download/${TAG}/released-package.zip"
          if ! grep -q "$EXPECTED" setup/azuredeploy.json; then
            echo "::error::setup/azuredeploy.json functionZipUrl must be pinned to ${EXPECTED}"
            grep functionZipUrl setup/azuredeploy.json
            exit 1
          fi
          echo "functionZipUrl OK: pinned to ${TAG}"

      - name: Build function app zip
        if: steps.check_release.outputs.state != 'published'
        run: |
          cd function-app
          # Pre-install pip dependencies into .python_packages so that the zip is
          # self-contained: the template and the AutoUpdater deploy it with
          # OneDeploy and remoteBuild=false (no build on Azure).
          # Force manylinux2014 (glibc 2.17) wheels so binaries run on the Azure
          # Functions Flex Consumption worker, not only on the GH runner's
          # glibc. Without --platform we get manylinux_2_34 wheels that can fail
          # with "GLIBC_2.3x not found".
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            --platform manylinux2014_x86_64 \
            --python-version 3.13 \
            --implementation cp \
            --only-binary=:all: \
            --target=".python_packages/lib/site-packages" \
            --no-compile \
            --require-hashes \
            -r requirements.lock
          zip -r ../s247-function-app.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x ".venv/*" \
            -x ".pytest_cache/*" \
            -x "tests/*" \
            -x "local.settings.json" \
            -x "requirements-dev.txt" \
            -x "requirements.lock"
          cd ..
          echo "Zip size: $(du -h s247-function-app.zip | cut -f1)"
          echo "Contents:"
          unzip -l s247-function-app.zip | tail -5

      # The same check the AutoUpdater runs before installing an update: every
      # function and shared module must import with only the zip's own
      # dependencies, on the runtime's Python (Linux x86_64).
      - name: Check the package imports
        if: steps.check_release.outputs.state != 'published'
        run: |
          PYTHONPATH="function-app/.python_packages/lib/site-packages:function-app" python3 - <<'PY'
          import sys
          from shared.updater import check_package_imports
          ok, reason = check_package_imports("s247-function-app.zip")
          print("Package import check:", "OK" if ok else reason)
          sys.exit(0 if ok else 1)
          PY

      - name: Generate version.json
        if: steps.check_release.outputs.state != 'published'
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Digest the exact zip we are about to publish so the AutoUpdater can
          # verify package integrity before deploying it (anti-tamper).
          SHA256="$(sha256sum s247-function-app.zip | cut -d' ' -f1)"
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "package_url": "https://github.com/${REPO}/releases/download/${TAG}/s247-function-app.zip",
            "sha256": "${SHA256}",
            "release_notes": "Auto-release of function app version ${VERSION}"
          }
          EOF
          cat version.json

      - name: Create GitHub Release
        if: steps.check_release.outputs.state != 'published'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          NOTES="Auto-release of Site24x7 Diagnostic Logs Function App version $VERSION"
          if [[ "$VERSION" != *-* ]]; then
            NOTES="$NOTES. Production validation evidence: $VALIDATION_REPORT_URL"
          fi

          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          # A draft from a failed run is unpublished and untagged: replace it. A published
          # release never reaches this step (see "Check the release state").
          if [ "${{ steps.check_release.outputs.state }}" = "draft" ]; then
            gh release delete "$TAG" --yes
          fi

          # The template installs released-package.zip (the file name Flex
          # Consumption documents for OneDeploy); the AutoUpdater downloads
          # s247-function-app.zip. Same bytes. Created as a draft with every file,
          # then published, so a published release never changes afterwards
          # (required when the repository makes releases immutable).
          cp s247-function-app.zip released-package.zip
          gh release create "$TAG" \
            --draft \
            --title "Function App $VERSION" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            "${RELEASE_FLAGS[@]}" \
            s247-function-app.zip \
            released-package.zip \
            version.json \
            setup/azuredeploy.json
          gh release edit "$TAG" --draft=false

          # Prove the address the template installs from serves the exact zip.
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/released-package.zip"
          WANT="$(sha256sum s247-function-app.zip | cut -d' ' -f1)"
          for attempt in $(seq 1 10); do
            if curl -sfL -o "$RUNNER_TEMP/check.zip" "$URL" && [ "$(sha256sum "$RUNNER_TEMP/check.zip" | cut -d' ' -f1)" = "$WANT" ]; then
              echo "Package URL OK: $URL"
              exit 0
            fi
            echo "Attempt $attempt: package not served yet; retrying"
            sleep 10
          done
          echo "::error::$URL does not serve the release zip"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_REPORT_URL: ${{ inputs.validation_report_url }}

      - name: Summary
        run: |
          echo "### Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Zip:** s247-function-app.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- **version.json URL:** https://github.com/${{ github.repository }}/releases/latest/download/version.json" >> "$GITHUB_STEP_SUMMARY"
